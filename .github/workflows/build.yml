name: casperos-build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      upload_iso:
        description: 'Keep the ~1.8 GB installer ISO as a downloadable artifact'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            mmdebstrap debootstrap debian-archive-keyring \
            parted dosfstools e2fsprogs xz-utils curl ca-certificates \
            qemu-system-x86 qemu-utils ovmf
          sudo ln -sf sid /usr/share/debootstrap/scripts/trixie 2>/dev/null || true

      - name: Build the CasperOS image
        run: |
          sudo bash build/build-image.sh \
            --root /tmp/casper-root \
            --img /tmp/casper-n220.img \
            --size 6G
        timeout-minutes: 150

      - name: KVM boot smoke test (both kernels)
        run: |
          sudo bash build/test/smoke-test.sh \
            --img /tmp/casper-n220.img \
            --out /tmp/casper-test
        timeout-minutes: 45

      - name: Run summary
        run: |
          echo "## CasperOS build summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/casper-build-report.txt ]; then
            cat /tmp/casper-build-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Image: $(numfmt --to=iec-i $(stat -c %s /tmp/casper-n220.img))" >> "$GITHUB_STEP_SUMMARY"
          echo "Logs and screenshots in the artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Compress and split for distribution
        run: |
          set -x
          cd /tmp
          # The smoke test's copy of the image is a throwaway and is worth ~3 GB
          # of runner disk. Drop it before the compressor needs that space.
          rm -rf /tmp/casper-test/test.img
          df -h /tmp || true
          [ -f casper-n220.img ] || { printf '::error::compress: /tmp/casper-n220.img is missing — the build step did not produce it\n'; exit 1; }
          echo "image: $(stat -c %s casper-n220.img) bytes, free: $(df -Pk /tmp | awk 'NR==2{print $4}') KB"
          # -T0 asks xz to size its buffers from total cores, and on a runner it
          # can exceed the default memory cap and exit immediately. Bound it.
          # Report the actual xz status: this step failed twice in 0-1s with the
          # reason buried in a log that needs a token to read, so the failure has
          # to arrive as an annotation.
          if ! xz -6e -T0 --memlimit-compress=4GiB -c casper-n220.img > casper-n220.img.xz; then
              rc=$?
              printf '::error::compress: xz exited %s (image %s bytes, free %s KB)\n' \
                  "$rc" "$(stat -c %s casper-n220.img)" "$(df -Pk /tmp | awk 'NR==2{print $4}')"
              exit 1
          fi
          echo "xz: $(stat -c %s casper-n220.img.xz) bytes"
          # The raw image is not uploaded anywhere (only the .xz parts are),
          # and "Run summary" has already read its size. It is 6 GB of runner
          # disk that nothing below this line needs.
          rm -f casper-n220.img
          # 6 GB image of which ~2.5 GB is data compresses to ~1.1 GB, i.e.
          # below the 1900M split size, so split produces one part identical to
          # the .xz. Keep the stream form (the release flow and the flash-iso
          # job both cat the parts) but do not keep a second copy of it.
          split -b 1900M -d -a 2 casper-n220.img.xz casper-n220.img.xz.
          rm -f casper-n220.img.xz
          ls -la casper-n220.img.xz.*
          sha256sum casper-n220.img.xz.* > casper-n220.img.xz.sha256
          cat casper-n220.img.xz.sha256
          df -h /tmp || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casper-n220-img
          path: |
            /tmp/casper-n220.img.xz.*
            /tmp/casper-n220.img.xz.sha256
            /tmp/casper-test/serial-boot1.log
            /tmp/casper-test/serial-boot2.log
            /tmp/casper-test/qemu-boot1.log
            /tmp/casper-test/qemu-boot2.log
            /tmp/casper-test/early-boot1.ppm
            /tmp/casper-test/early-boot2.ppm
            /tmp/casper-test/session-boot1.ppm
            /tmp/casper-test/session-boot2.ppm
            /tmp/casper-build-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # wait for the build job's release to be created, then attach
          for i in $(seq 1 30); do
            gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && break
            sleep 20
          done
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" casper-n220.img.xz.* \
              --repo "$REPO" --clobber
          else
            gh release create "$TAG" casper-n220.img.xz.* \
              --repo "$REPO" \
              --title "CasperOS $TAG" \
              --notes "CasperOS image for Casper Nirvana N220/N240. See README for flashing." \
              || true
          fi

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xorriso isolinux cpio gzip xz-utils qemu-system-x86 qemu-utils ovmf curl hfsprogs \
            grub-efi-ia32-bin grub-efi-amd64-bin grub-pc-bin dosfstools mtools file \
            mmdebstrap debootstrap debian-archive-keyring apt-utils

      - name: Build the CasperOS installer ISO (preseeded netinst, offline repo)
        run: |
          # Builds the offline apt repository into the ISO, so the install
          # itself needs no network. Needs a network HERE (build time), which
          # is exactly the point: the tablet does not.
          sudo bash build/preseed/build-installer-iso.sh /tmp/casper-install.iso
          # Report the size so the storage cost is visible per run instead of
          # only when someone runs out of disk.
          {
            echo "## CasperOS installer ISO"
            echo ""
            echo "ISO: $(numfmt --to=iec-i "$(stat -c %s /tmp/casper-install.iso)")"
            echo ""
            echo "| part | size |"
            echo "|---|---|"
            echo "| offline repo (.deb) | $(du -sh /tmp/casper-installer/payload/offline 2>/dev/null | cut -f1) |"
            echo "| 5.15 kernel debs | $(du -sh /tmp/casper-installer/payload/casperos/k515 2>/dev/null | cut -f1) |"
          } | tee /tmp/casper-offline-repo-size.txt >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 40

      - name: "Sanity: does a stock Debian netinst kernel boot in this QEMU setup?"
        run: |
          # This checks the SAME boot path the installer test uses — direct
          # -kernel/-initrd boot, no firmware — so a failure here means the
          # harness is broken rather than the ISO. It previously booted the ISO
          # through OVMF, a path the test never takes, and its verdict was a
          # bare `grep ... && echo || echo` that exited 0 either way: it printed
          # FAILED for two runs while the step stayed green. Now it gates.
          NB=https://cdimage.debian.org/debian-cd/current/amd64/iso-cd
          NN=$(curl -fsSL "$NB/SHA256SUMS" | awk '$2 ~ /-netinst\.iso$/ {print $2; exit}')
          [ -n "$NN" ] || { printf '::error::sanity: could not resolve the current netinst name\n'; exit 1; }
          echo "current netinst: $NN"
          curl -fsSL --retry 3 -o /tmp/netinst-check.iso "$NB/$NN"
          mkdir -p /tmp/nb-iso
          mount -o loop,ro /tmp/netinst-check.iso /tmp/nb-iso || exit 1
          cp /tmp/nb-iso/install.amd/vmlinuz /tmp/nb-vmlinuz
          cp /tmp/nb-iso/install.amd/initrd.gz /tmp/nb-initrd.gz
          umount /tmp/nb-iso
          ls -la /tmp/nb-vmlinuz /tmp/nb-initrd.gz
          # Same shape as installer-test.sh: -kernel/-initrd, serial to a file.
          timeout 120 qemu-system-x86_64 \
            -enable-kvm -machine q35 -m 2048 -smp 2 -cpu qemu64 \
            -kernel /tmp/nb-vmlinuz -initrd /tmp/nb-initrd.gz \
            -append "console=ttyS0,115200 DEBIAN_FRONTEND=text" \
            -serial file:/tmp/netinst-sanity.log \
            -display none -vga std -no-reboot >/dev/null 2>&1 || true
          echo "--- stock netinst serial ($(stat -c %s /tmp/netinst-sanity.log 2>/dev/null || echo 0) bytes, first 20 lines):"
          head -20 /tmp/netinst-sanity.log 2>/dev/null || true
          if grep -aqE 'Linux version|Kernel command line|debian-installer' /tmp/netinst-sanity.log; then
            echo "SANITY: a stock d-i kernel OS boots under this QEMU"
            printf '::notice::sanity: stock d-i kernel boots under this QEMU setup\n'
          else
            echo "SANITY FAILED: no kernel output captured"
            printf '::error::sanity: a stock d-i kernel does NOT boot under this QEMU setup — the installer test below cannot be trusted\n'
            exit 1
          fi
          rm -f /tmp/netinst-check.iso

      - name: "Test the installer (QEMU IA32, NO network: full auto-install + verify)"
        run: |
          # The install must complete offline. The ISO carries the entire
          # package closure, and installer-test.sh boots QEMU with -nic none,
          # so a regression that reintroduces a download fails here.
          sudo CASPER_INSTALL_TIMEOUT=3600 bash build/test/installer-test.sh \
            /tmp/casper-install.iso /tmp/installer-test
        timeout-minutes: 90

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casper-installer
          path: |
            /tmp/installer-test/live-evidence.log
            /tmp/installer-test/verify.log
            /tmp/installer-test/serial-install.log
            /tmp/installer-test/qemu-install.log
            /tmp/casper-offline-repo-size.txt
          retention-days: 30

      # The ISO is ~1.8 GB now that it carries the offline package repository,
      # and it is rebuilt from scratch every run. Uploading it on every push
      # would double that on the runner AND keep 1.8 GB of artifacts for 30
      # days per run, which is what made a single run cost tens of gigabytes.
      # Release tags still get it (the step below), and so does anyone who
      # asks for it by dispatching the workflow with upload_iso=true.
      - name: Upload the installer ISO (tags and on request only)
        uses: actions/upload-artifact@v4
        if: always() && (startsWith(github.ref, 'refs/tags/') || inputs.upload_iso)
        with:
          name: casper-install-iso
          path: /tmp/casper-install.iso
          retention-days: 7

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "release visible"
              break
            fi
            sleep 20
          done
          sha256sum /tmp/casper-install.iso > /tmp/casper-install.iso.sha256
          for f in /tmp/casper-install.iso /tmp/casper-install.iso.sha256; do
            for i in $(seq 1 5); do
              echo "uploading $f (attempt $i)"
              gh release upload "${{ github.ref_name }}" "$f" \
                --repo "${{ github.repository }}" --clobber && break
              sleep 30
            done
          done

  flash-iso:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            mmdebstrap debootstrap debian-archive-keyring \
            grub-common grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin \
            xorriso mtools zip xz-utils qemu-system-x86 qemu-utils ovmf
          sudo ln -sf sid /usr/share/debootstrap/scripts/trixie 2>/dev/null || true

      - name: Fetch the image from the build job
        uses: actions/download-artifact@v4
        with:
          name: casper-n220-img
          path: /tmp/img-artifact

      - name: Prepare the embedded payload (compressed image)
        run: |
          mkdir -p /tmp/payload
          cat /tmp/img-artifact/casper-n220.img.xz.?? > /tmp/payload/casper-n220.img.xz
          sha256sum /tmp/payload/casper-n220.img.xz | cut -d' ' -f1 > /tmp/payload.sha
          rm -rf /tmp/img-artifact
          echo "embedded payload: $(stat -c %s /tmp/payload/casper-n220.img.xz) bytes"

      - name: Build the flash environment
        run: |
          sudo bash build/flash-iso/build-flash-iso.sh env /tmp/flash-root
        timeout-minutes: 25

      - name: Assemble the self-contained flash ISO (image embedded)
        run: |
          sudo bash build/flash-iso/build-flash-iso.sh iso \
            /tmp/flash-root /tmp/casper-flash.iso /tmp/payload/casper-n220.img.xz
        timeout-minutes: 20

      - name: Verify the ISO contains the exact image
        run: |
          mkdir -p /tmp/iso-mnt
          sudo mount -o loop,ro /tmp/casper-flash.iso /tmp/iso-mnt
          echo "embedded: $(stat -c %s /tmp/iso-mnt/casper-n220.img.xz) bytes"
          sha256sum /tmp/iso-mnt/casper-n220.img.xz | cut -d' ' -f1 > /tmp/embedded.sha
          sudo umount /tmp/iso-mnt
          cmp /tmp/embedded.sha /tmp/payload.sha \
            && echo "ISO embeds the exact image" || exit 1

      - name: Test the flash ISO (QEMU, 32-bit OVMF, SD-card target)
        run: |
          sudo bash build/test/flash-iso-test.sh \
            /tmp/flash-root /tmp/flash-test
        timeout-minutes: 20

      - name: Build the ESP kit
        run: |
          sudo bash build/flash-iso/build-flash-iso.sh kit \
            /tmp/flash-root /tmp/casper-flash-esp.zip

      - name: Compress and split the self-contained ISO
        run: |
          cd /tmp
          # the chroot's proc/sys mounts can't be removed — ignore failures
          rm -rf /tmp/flash-root 2>/dev/null || true
          rm -rf /tmp/flash-test/isotree /tmp/flash-test/test.iso 2>/dev/null || true
          # The embedded payload has already been copied into the ISO by
          # grub-mkrescue and verified byte-for-byte against /tmp/payload.sha
          # (a 64-byte file). 1.1 GB of duplicate is not needed any more.
          rm -f /tmp/payload/casper-n220.img.xz
          xz -6eT0 -c casper-flash.iso > casper-flash.iso.xz
          # The payload inside the ISO is already xz-compressed, so this second
          # pass barely compresses and the split parts are a full duplicate of
          # the .xz. Keep the parts (the release flow uploads exactly those),
          # drop the redundant whole file.
          split -b 900M -d -a 2 casper-flash.iso.xz casper-flash.iso.xz.
          rm -f casper-flash.iso.xz /tmp/casper-flash.iso
          ls -la casper-flash.iso.xz.*
          sha256sum casper-flash.iso.xz.* > casper-flash.iso.xz.sha256
          cat casper-flash.iso.xz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casper-flash
          path: |
            /tmp/casper-flash.iso.xz.*
            /tmp/casper-flash.iso.xz.sha256
            /tmp/casper-flash-esp.zip
            /tmp/flash-test/serial.log
          retention-days: 30

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ref: ${{ github.ref }}"
          ls -la /tmp/casper-flash.iso.xz.* /tmp/casper-flash-esp.zip 2>/dev/null || true
          # wait for the release to exist (created by the build job)
          for i in $(seq 1 30); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "release visible"
              break
            fi
            sleep 20
          done
          # upload each file with retries (the big ones can be flaky);
          # fail loudly if there is nothing to upload
          N=0
          for f in /tmp/casper-flash.iso.xz.* /tmp/casper-flash-esp.zip; do
            [ -f "$f" ] || continue
            N=$((N+1))
            for i in $(seq 1 5); do
              echo "uploading $f (attempt $i)"
              gh release upload "${{ github.ref_name }}" "$f" \
                --repo "${{ github.repository }}" --clobber && break
              sleep 30
            done
          done
          [ "$N" -gt 0 ] || { echo "ERROR: no files to upload"; exit 1; }
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --json assets --jq '[.assets[].name] | join(", ")'
