name: casperos-build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            mmdebstrap debootstrap debian-archive-keyring \
            parted dosfstools e2fsprogs xz-utils curl ca-certificates \
            qemu-system-x86 qemu-utils ovmf
          sudo ln -sf sid /usr/share/debootstrap/scripts/trixie 2>/dev/null || true

      - name: Build the CasperOS image
        run: |
          sudo bash build/build-image.sh \
            --root /tmp/casper-root \
            --img /tmp/casper-n220.img \
            --size 6G
        timeout-minutes: 150

      - name: KVM boot smoke test (both kernels)
        run: |
          sudo bash build/test/smoke-test.sh \
            --img /tmp/casper-n220.img \
            --out /tmp/casper-test
        timeout-minutes: 45

      - name: Run summary
        run: |
          echo "## CasperOS build summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/casper-build-report.txt ]; then
            cat /tmp/casper-build-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Image: $(numfmt --to=iec-i $(stat -c %s /tmp/casper-n220.img))" >> "$GITHUB_STEP_SUMMARY"
          echo "Logs and screenshots in the artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Compress and split for distribution
        run: |
          cd /tmp
          xz -6eT0 -c casper-n220.img > casper-n220.img.xz
          split -b 1900M -d -a 2 casper-n220.img.xz casper-n220.img.xz.
          ls -la casper-n220.img.xz.*
          sha256sum casper-n220.img.xz.* > casper-n220.img.xz.sha256
          cat casper-n220.img.xz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casper-n220-img
          path: |
            /tmp/casper-n220.img.xz.*
            /tmp/casper-n220.img.xz.sha256
            /tmp/casper-test/serial-boot1.log
            /tmp/casper-test/serial-boot2.log
            /tmp/casper-test/qemu-boot1.log
            /tmp/casper-test/qemu-boot2.log
            /tmp/casper-test/early-boot1.ppm
            /tmp/casper-test/early-boot2.ppm
            /tmp/casper-test/gdm-boot1.ppm
            /tmp/casper-test/gdm-boot2.ppm
            /tmp/casper-build-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp
          gh release create "${{ github.ref_name }}" \
            casper-n220.img.xz.* \
            --repo "${{ github.repository }}" \
            --title "CasperOS ${{ github.ref_name }}" \
            --notes "CasperOS image for Casper Nirvana N220/N240. See README for flashing. \
            Split parts: download all casper-n220.img.xz.XX parts + sha256, then:
            \`cat casper-n220.img.xz.* | xz -dc > casper-n220.img\`"

  flash-iso:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            mmdebstrap debootstrap debian-archive-keyring \
            grub-common grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin \
            xorriso mtools zip xz-utils qemu-system-x86 qemu-utils ovmf
          sudo ln -sf sid /usr/share/debootstrap/scripts/trixie 2>/dev/null || true

      - name: Fetch the image from the build job
        uses: actions/download-artifact@v4
        with:
          name: casper-n220-img
          path: /tmp/img-artifact

      - name: Decompress the raw image
        run: |
          cat /tmp/img-artifact/casper-n220.img.xz.?? | xz -dc > /tmp/casper-n220.img
          rm -rf /tmp/img-artifact
          sha256sum /tmp/casper-n220.img > /tmp/casper-n220.img.sha
          echo "raw image: $(stat -c %s /tmp/casper-n220.img) bytes"

      - name: Build the flash environment
        run: |
          sudo bash build/flash-iso/build-flash-iso.sh env /tmp/flash-root
        timeout-minutes: 25

      - name: Assemble the self-contained flash ISO (image embedded)
        run: |
          sudo bash build/flash-iso/build-flash-iso.sh iso \
            /tmp/flash-root /tmp/casper-flash.iso /tmp/casper-n220.img
        timeout-minutes: 20

      - name: Verify the ISO contains the exact image
        run: |
          mkdir -p /tmp/iso-mnt
          sudo mount -o loop,ro /tmp/casper-flash.iso /tmp/iso-mnt
          EMBEDDED_SIZE=$(stat -c %s /tmp/iso-mnt/casper-n220.img)
          RAW_SIZE=$(stat -c %s /tmp/casper-n220.img)
          echo "embedded: $EMBEDDED_SIZE  raw: $RAW_SIZE"
          [ "$EMBEDDED_SIZE" = "$RAW_SIZE" ] || exit 1
          sha256sum /tmp/iso-mnt/casper-n220.img | cut -d' ' -f1 > /tmp/embedded.sha
          sudo umount /tmp/iso-mnt
          cmp /tmp/embedded.sha <(cut -d' ' -f1 /tmp/casper-n220.img.sha) \
            && echo "ISO embeds the exact image" || exit 1
          # free the standalone image now (it lives inside the ISO)
          rm -f /tmp/casper-n220.img

      - name: Test the flash ISO (QEMU, 32-bit OVMF, SD-card target)
        run: |
          sudo bash build/test/flash-iso-test.sh \
            /tmp/flash-root /tmp/flash-test
        timeout-minutes: 20

      - name: Build the ESP kit
        run: |
          sudo bash build/flash-iso/build-flash-iso.sh kit \
            /tmp/flash-root /tmp/casper-flash-esp.zip

      - name: Compress and split the self-contained ISO
        run: |
          cd /tmp
          rm -rf /tmp/flash-root /tmp/flash-test/isotree /tmp/flash-test/test.iso
          xz -6eT0 -c casper-flash.iso > casper-flash.iso.xz
          split -b 1900M -d -a 2 casper-flash.iso.xz casper-flash.iso.xz.
          ls -la casper-flash.iso.xz.*
          sha256sum casper-flash.iso.xz.* > casper-flash.iso.xz.sha256
          cat casper-flash.iso.xz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casper-flash
          path: |
            /tmp/casper-flash.iso.xz.*
            /tmp/casper-flash.iso.xz.sha256
            /tmp/casper-flash-esp.zip
            /tmp/flash-test/serial.log
          retention-days: 30

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # wait for the release to exist (created by the build job)
          for i in $(seq 1 30); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              break
            fi
            sleep 20
          done
          gh release upload "${{ github.ref_name }}" \
            /tmp/casper-flash.iso.xz.* /tmp/casper-flash.iso.xz.sha256 \
            /tmp/casper-flash-esp.zip \
            --repo "${{ github.repository }}" --clobber
