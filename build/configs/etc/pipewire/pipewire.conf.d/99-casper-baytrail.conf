# CasperOS — PipeWire clock for the Atom Z3735F.
#
# quantum 2048 (~43 ms at 48 kHz) is the smallest buffer this CPU sustains
# while Firefox and the GPU are both busy; locked 48 kHz means no stream has
# to be resampled, and resample.quality 4 (of 15) is the point where the
# extra CPU stops being audible on a tablet speaker.
context.properties = {
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 1024
    default.clock.max-quantum   = 4096
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    resample.quality            = 4
}
