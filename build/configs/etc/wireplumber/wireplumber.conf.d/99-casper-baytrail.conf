# CasperOS — RT5640 / Bay Trail audio, WirePlumber 0.5 (trixie ships 0.5.8).
#
# Only the 0.5 syntax is shipped: the 0.4 Lua config that older guides tell
# you to write is dead code on trixie, and a file in the wrong syntax fails
# silently — that is exactly how "audio config looks right but nothing works"
# happens.
#
# WHAT THIS FIXES
#  - The 5-second pop after silence and the "first second of playback is
#    missing" are the PCM being suspended. A 2 W tablet does not notice the
#    battery cost of pinning it open.
#  - The crackle is a buffer problem, not a bug: a 1.33 GHz Silvermont cannot
#    always fill the default 1024-frame period while the GPU is busy. 2048
#    frames + 8192 headroom is ~43 ms at 48 kHz and survives that contention.
#  - S16LE/48 kHz avoids a resample per stream, which is real CPU on this SoC.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        api.alsa.use-ucm                = true
        api.alsa.period-size            = 2048
        api.alsa.headroom               = 8192
        audio.format                    = "S16LE"
        audio.rate                      = 48000
      }
    }
  }
]
