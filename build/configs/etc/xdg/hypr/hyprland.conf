# CasperOS — Hyprland session for the Nirvana N220 (tablet, 2 GB RAM, Gen7 GPU).
#
# System-wide: Hyprland reads this when the user has no
# ~/.config/hypr/hyprland.conf. This is the ONLY session on the image: greetd
# autologins here, so if the compositor cannot start on this GPU there is no
# GUI to fall back to — /etc/greetd/config.toml drops to a shell instead.
#
# Deliberately sparse. On a 4-EU Bay Trail GPU the two things that make a QML
# desktop stutter are blur and animation, so both are off; the shell looks
# correct without them.

# The panel is physically portrait. transform 1 (90 degrees) is the whole
# rotation story here; the mutter-era monitors.xml is gone from the image.
# Without this the desktop boots sideways.
monitor = , preferred, auto, 1, transform, 1

# Caelestia loads its version helper from here (CMake INSTALL_LIBDIR).
env = CAELESTIA_LIB_DIR, /usr/lib/caelestia
# Gen7 is served by i965 — iHD does not support it (also set in
# /etc/environment.d/casper-vaapi.conf).
env = LIBVA_DRIVER_NAME, i965

# Start the shell once the compositor is up. Guarded on purpose: if the build
# report says the shell was not compiled, you still get a usable bare session
# instead of a black screen.
exec-once = sh -c 'command -v qs >/dev/null 2>&1 && qs -c caelestia -n -d'

input {
    kb_layout = tr
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    resize_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

xwayland {
    enabled = true
}

# The one touch gesture that works without hyprgrass (not packaged in Debian).
gesture = 3, horizontal, workspace

# Escape hatches that need no keyboard beyond these three.
bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive
bind = SUPER, L, exec, loginctl lock-session
