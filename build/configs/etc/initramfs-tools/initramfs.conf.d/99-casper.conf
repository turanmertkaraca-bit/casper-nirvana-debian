# CasperOS — initramfs tuning for a 2 GB tablet with a slow eMMC.
#
# COMPRESS=zstd : decompresses several times faster than gzip on Silvermont,
#                 which is most of the post-GRUB pause on this device.
# MODULES=dep   : only the modules the root device actually needs, instead of
#                 Debian's default `most` (which pulls in ~50 MB of firmware
#                 and drivers the tablet never loads). Smaller initrd means
#                 less to read off the eMMC and less RAM held during boot.
#
# This device boots from eMMC (mmc_block) with an ext4 root over plain
# partitions — all of which `dep` resolves on its own.
COMPRESS=zstd
MODULES=dep
