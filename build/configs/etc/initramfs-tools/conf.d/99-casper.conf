# CasperOS — initramfs tuning for a 2 GB tablet with a slow eMMC.
#
# COMPRESS=zstd : decompresses several times faster than gzip on Silvermont,
#                 which is most of the post-GRUB pause on this device.
#                 (Already Debian's default since initramfs-tools 0.141; kept
#                 explicit so it survives a default change.)
#
# MODULES=most, NOT dep. This file used to say MODULES=dep, and that was both
# broken and dangerous:
#
#   * broken: it lived in /etc/initramfs-tools/initramfs.conf.d/, but
#     mkinitramfs only sources $CONFDIR/initramfs.conf and then the files in
#     $CONFDIR/conf.d/ (initramfs.conf(5)). Nothing ever read it, so every
#     initrd was built with the package default anyway.
#
#   * dangerous: `dep` "tries to guess which modules are necessary for the
#     RUNNING box" (initramfs.conf(5)) by reading /proc/mounts, /proc/cmdline
#     and /sys. In this build the initrd is generated inside a chroot on a
#     GitHub runner, so the "running box" is a cloud VM with virtio disks —
#     /sys/bus/mmc does not exist there, so mmc_block is not added, and the
#     tablet would panic in local_mount_root with "does not exist". There is
#     no error at build time; the image simply does not boot.
#
# `most` is hardware-agnostic and is what a stock Debian 13 install uses
# (d-i only writes conf.d/driver-policy when you pick something other than
# most). /etc/initramfs-tools/modules names the tablet's actual storage stack
# explicitly as a belt-and-braces measure, and 05-finalize.sh asserts with
# lsinitramfs that those modules really are inside the built initrd — so a
# missing driver fails the build instead of shipping.
MODULES=most
# FSTYPE=auto cannot resolve the root device inside the chroot (fsck hook ->
# blkid on the host's /dev), so it silently ships no fsck.ext4. State it.
FSTYPE=ext4
