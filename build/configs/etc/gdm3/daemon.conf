# CasperOS — GDM daemon configuration.
#
# NOTE the filename: gdm3 48 in trixie is built with
# -Dcustom-conf=/etc/gdm3/daemon.conf, and the binary contains that path. The
# /etc/gdm3/custom.conf this repo used to ship is never read — it was inert.
# WaylandEnable defaults to true, so this file is mostly documentation of the
# intent rather than a change.
[daemon]
WaylandEnable=true
