# CasperOS — Bay Trail audio.
# dsp_driver=2 -> SST (Smart Sound Technology), correct for Z3735F
# (0=auto, 1=legacy HDA, 2=SST, 3=SOF)
options snd_intel_dspcfg dsp_driver=2
# Keep the HDA controller from power-cycling (that's the 5-second pop and
# the first-second-of-sound cut after silence)
options snd_hda_intel power_save=0
options snd_hda_intel dmic_detect=0
options snd_hda_intel power_save_controller=N
