# CasperOS — memory tuning for Atom Z3735F + 2 GB RAM + zram-only swap.
#
# swappiness=180 (NOT 10!): with zram, "swapping" means compressing a page
# into RAM — far cheaper than re-reading from the slow eMMC. Kernel docs
# recommend >100 for zram/zswap.
vm.swappiness=180
# zram has no seek cost — page-in readahead just wastes CPU
vm.page-cluster=0
# Keep directory/inode caches around longer (eMMC re-reads are slow)
vm.vfs_cache_pressure=50
# Smaller dirty buffers = fewer multi-second eMMC writeback stalls
vm.dirty_ratio=10
vm.dirty_background_ratio=5
vm.dirty_expire_centisecs=1500
vm.dirty_writeback_centisecs=500
# Don't let kswapd over-reclaim after bursts (reduces stutter)
vm.watermark_boost_factor=0
# Wake kswapd a little earlier so allocation stalls are rarer on 2 GB
vm.watermark_scale_factor=125
# /proc/vmstat is only recomputed every 10s (default 1s). On a 1.33GHz Atom
# the once-per-second refresher is pure overhead nobody reads.
vm.stat_interval=10

# ── network: BBR + fq ──────────────────────────────────────────────────────
# The RTL8723BS is a lossy 1x1 802.11n radio. BBR keeps throughput up where
# cubic collapses on loss, and does it with less per-packet CPU. fq is the
# qdisc BBR is designed to pair with (load tcp_bbr via
# /etc/modules-load.d/casper-bbr.conf so the sysctl below can apply).
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
