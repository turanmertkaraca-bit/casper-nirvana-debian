# CasperOS — GRUB defaults (loaded via /etc/default/grub.d/)
# Hidden menu: the machine boots straight to the plymouth splash, like
# Windows. Hold Shift / press Esc during boot to reveal the menu —
# the 5.15 fallback kernel lives under "Advanced options".
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
GRUB_DISABLE_OS_PROBER=true

# Common kernel parameters for BOTH kernels (Bay Trail tuning):
#  - intel_idle.max_cstate=1 : touchscreen freeze root cause (deep C-states
#    gate the LPSS I2C clock the touch controller sits on)
#  - i915.enable_psr/dc/fbc=0: display flicker / stalls on Gen7
#  - pci=hpiosize=0, usbcore.autosuspend=-1 : I/O + USB power quirks
#  - snd_*: SST audio driver + no 5-second power pop
#  - mitigations=off: 20-40% syscall win on Silvermont (personal tablet;
#    disclosed in README — not for hostile-multiuser use)
#  - nowatchdog, transparent_hugepage=never: latency/CPU savings
#  - quiet splash: plymouth boot animation, no kernel spew
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash intel_idle.max_cstate=1 i915.enable_psr=0 i915.enable_dc=0 i915.enable_fbc=0 pci=hpiosize=0 usbcore.autosuspend=-1 snd_intel_dspcfg.dsp_driver=2 snd_hda_intel.dmic_detect=0 snd_hda_intel.power_save=0 snd_hda_intel.power_save_controller=N mitigations=off nowatchdog transparent_hugepage=never"
