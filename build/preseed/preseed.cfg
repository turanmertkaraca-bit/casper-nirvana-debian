# CasperOS — Debian installer preseed: fully automatic install.
# Locale/language: Turkish; timezone Istanbul; whole-disk install on the
# first (internal) disk; user "lvy"; all CasperOS fixes via late_command.

# ── locale / keyboard / time ───────────────────────────────────────────────
d-i debian-installer/locale string tr_TR.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string TR
d-i debian-installer/locale select tr_TR.UTF-8
d-i keyboard-configuration/xkb-keymap select tr
d-i keyboard-configuration/layoutcode string tr
d-i time/zone string Europe/Istanbul
d-i clock-setup/utc boolean true
d-i clock-setup/utc-auto boolean true

# ── network (DHCP; RTL8723BS firmware is bundled in the initrd) ────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string casper-n220
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
d-i netcfg/disable_autoconfig boolean false

# ── mirror ─────────────────────────────────────────────────────────────────
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true

# ── partitioning: entire first disk, single partition, no LVM/encryption ──
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_point_failure boolean continue

# ── user "lvy" (a placeholder password — removed by the fixup) ─────────────
d-i passwd/root-login boolean false
d-i passwd/user-fullname string lvy
d-i passwd/username string lvy
d-i passwd/user-password string casper0s
d-i passwd/user-password-again string casper0s
d-i passwd/user-default-groups string sudo audio video input adm plugdev dip
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# ── GRUB: install to the boot disk (32-bit UEFI auto-detected) ─────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/grub2_instead_of_grub_legacy boolean true

# ── packages: base system only; the fixup installs the exact set ───────────
tasksel tasksel/first multiselect
d-i base-installer/kernel/image string linux-image-amd64
d-i apt-setup/security_host string security.debian.org

# ── finish ─────────────────────────────────────────────────────────────────
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/halt boolean false
d-i debian-installer/exit/poweroff boolean false
d-i debian-installer/quiet boolean true

# ── apply all CasperOS fixes on the installed system ───────────────────────
# the fix payload lives in the initrd (/casperos) and on the ISO (/cdrom/casperos)
d-i preseed/late_command string \
    mkdir -p /target/tmp/casperos ; \
    cp -a /casperos /target/tmp/ 2>/dev/null || cp -a /cdrom/casperos /target/tmp/ 2>/dev/null ; \
    in-target bash /tmp/casperos/casperos-fixup.sh ; \
    in-target rm -rf /tmp/casperos

# diagnostic marker: proves the preseed was actually applied (visible on
# the install console/serial)
d-i preseed/early_command string \
    echo "PRESEED-APPLIED" >/dev/ttyS0 2>/dev/null ; \
    echo "PRESEED-APPLIED" >/dev/tty0 2>/dev/null ; \
    true
