#_preseed_V1
# CasperOS — Debian installer preseed: fully automatic install.
# Locale/language: Turkish; timezone Istanbul; whole-disk install on the
# first (internal) disk; user "lvy"; all CasperOS fixes via late_command.
#
# The #_preseed_V1 header is not decorative: Debian's installation guide B.3
# states "The file should start with #_preseed_V1", and debconf-set-selections
# uses it to tell a preseeding file apart from a plain selection dump.
#
# ── WHY THE INSTALL USED TO HANG FOREVER AT A DIALOG ───────────────────────
# `auto` on the kernel command line is only an alias for auto-install/enable.
# It does *not* raise debconf's priority. Debian's guide (5.3.2) says "The
# default installation uses priority=high", and the installer's own `auto`
# boot label is literally `auto=true priority=critical` — we had copied only
# half of it. At priority=high the installer stops and waits at the first
# high-priority question, e.g. localechooser/translation/warn-light ("Continue
# the installation in the selected language?"). With no keyboard attached to
# the test VM it waited 7200s and produced nothing. `priority=critical` is set
# on every boot entry (build-installer-iso.sh) and mirrored here, because the
# preseed is also reachable from a hand-edited boot line.
d-i debconf/priority string critical

# ── locale / keyboard / time ───────────────────────────────────────────────
# ONE locale line, with the type the template actually declares. Setting it
# both as `string` and `select` is two writes to the same debconf variable and
# only the last one wins, which makes the file order-dependent for no gain.
d-i debian-installer/language string en
d-i debian-installer/country string TR
d-i debian-installer/locale select tr_TR.UTF-8
d-i keyboard-configuration/xkb-keymap select tr
d-i time/zone string Europe/Istanbul
d-i clock-setup/utc boolean true
d-i clock-setup/utc-auto boolean true

# ── network: NOT NEEDED. The ISO is self-contained. ───────────────────────
# The install must finish with no cable, no Wi-Fi and no mirror. Everything
# the package set needs is in the "casperos-offline" apt repository baked onto
# the ISO (see build/preseed/make-offline-repo.sh), and the fixup points apt at
# it. Declaring that up front means netcfg never probes, never waits for DHCP,
# and can never raise its no-interface error dialog.
d-i netcfg/enable boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string casper-n220
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
d-i netcfg/disable_autoconfig boolean true

# ── package source: the ISO itself ────────────────────────────────────────
# partman mounts the install medium at /media/cdrom; the offline repo is a
# flat apt repository at its root. preseed/late_command rewrites
# sources.list before it calls apt (see casperos-fixup.sh), so this is only
# what the base install uses.
# apt-setup/use_mirror=false is what makes d-i skip the mirror question
# entirely — without it, disabling netcfg makes d-i fall back to CD media and
# then still ask.
d-i apt-setup/use_mirror boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true

# ── partitioning: entire first disk, single partition, no LVM/encryption ──
# NOTE: partman-auto/disk is deliberately NOT set. This was briefly set to
# /dev/sda, which is wrong on the actual hardware: the N220/N240 boots from
# eMMC, i.e. /dev/mmcblk0, so preseeded /dev/sda resolves to nothing, partman-auto
# bails out of automatic mode and falls back to the interactive "Select disk to
# partition" prompt — the same hang this file exists to prevent.
# Debian's guide (B.4.8.1) states that with a single disk the installer
# defaults to using it, and partman-auto's initial_auto implements exactly
# that, device-name agnostically. That is what we rely on, so the same preseed
# works on the tablet (mmcblk0) and in the QEMU test (sda).
d-i partman-auto/method string regular
# small_disk, not atomic: atomic's amd64 minimum is ~9.3 GB (biosgrub + 768 MB
# /boot + 8 GB / + swap) and partman-auto only offers recipes that fit the
# free space, so on a small target it silently falls back and the preseed
# value never applies. small_disk is the recipe for disks under 10 GB, which is
# both the 4 GB test disk and any modest eMMC.
d-i partman-auto/choose_recipe select small_disk
# partman-lvm and partman-md still register *critical* confirm questions when
# they run, even with method=regular. On a blank disk they are no-ops, but if
# the target ever carries an old LVM/RAID signature they become a prompt, so
# they are preseeded here rather than left to chance.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_point_failure boolean continue

# ── user "lvy" (a placeholder password — removed by the fixup) ─────────────
d-i passwd/root-login boolean false
d-i passwd/user-fullname string lvy
d-i passwd/username string lvy
d-i passwd/user-password string casper0s
d-i passwd/user-password-again string casper0s
d-i passwd/user-default-groups string sudo audio video input adm plugdev dip
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# ── GRUB: install to the boot disk (32-bit UEFI auto-detected) ─────────────
# "default" is a legal magic value for grub-installer/bootdev (added in
# grub-installer 1.103 so unattended installs skip the prompt) — it is not a
# device name, and it does not need to be one.
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# ── packages: base system only; the fixup installs the exact set ───────────
tasksel tasksel/first multiselect
d-i base-installer/kernel/image string linux-image-amd64
d-i apt-setup/security_host string security.debian.org

# ── finish ─────────────────────────────────────────────────────────────────
# reboot: the test harness waits for the QEMU process to exit, and a halted
# installer would look exactly like a hung one.
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/halt boolean false
d-i debian-installer/exit/poweroff boolean false
d-i debian-installer/quiet boolean true

# ── apply all CasperOS fixes on the installed system ───────────────────────
# the fix payload lives in the initrd (/casperos) and on the ISO (/cdrom/casperos)
#
# `;` would make the whole late_command's status that of the LAST command
# (`in-target rm -rf`), which always succeeds — so a fixup that died halfway
# still produced a "successful" plain Debian install. Keep the cleanup
# unconditional, but return the fixup's own status so d-i can report it.
d-i preseed/late_command string \
    mkdir -p /target/tmp/casperos ; \
    cp -a /casperos /target/tmp/ 2>/dev/null || cp -a /cdrom/casperos /target/tmp/ 2>/dev/null ; \
    rc=0 ; \
    in-target bash /tmp/casperos/casperos-fixup.sh || rc=$? ; \
    in-target rm -rf /tmp/casperos ; \
    if [ "$rc" -ne 0 ]; then echo "casperos-fixup FAILED (exit $rc) - CasperOS is NOT applied" > /dev/ttyS0 2>/dev/null ; fi ; \
    exit $rc

# diagnostic marker: proves the preseed was actually applied (visible on
# the install console/serial). Echoed BEFORE any question is asked, so "no
# PRESEED-APPLIED on the serial log" means the preseed was never read at all —
# which is a different bug from "the preseed was read and then it stalled".
d-i preseed/early_command string \
    echo "PRESEED-APPLIED" > /dev/ttyS0 2>/dev/null ; \
    echo "PRESEED-APPLIED" > /dev/tty0 2>/dev/null ; \
    true
